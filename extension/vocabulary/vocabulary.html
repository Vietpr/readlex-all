<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReadLex · Vocabulary</title>
  <link rel="stylesheet" href="../shared/common.css">
  <link rel="stylesheet" href="vocabulary.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <span class="wordmark">Read<span>Lex</span></span>
      <nav class="app-nav" aria-label="Extension pages">
        <a href="vocabulary.html" aria-current="page">Vocabulary</a>
        <a href="../options/options.html">Settings</a>
      </nav>
      <div class="header-actions">
        <button type="button" class="btn hidden" id="btn-run-ai" title="Ask Gemini to explain the words that are waiting">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path><path d="M19 16v4"></path><path d="M17 18h4"></path></svg>
          Run AI <span id="pending-count"></span>
        </button>
        <details class="menu-box" id="backup-menu">
          <summary class="btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"></path><path d="M7 10.5l5 5 5-5"></path><path d="M5 20h14"></path></svg>
            Backup &amp; export
            <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
          </summary>
          <div class="menu-pop card">
            <button type="button" id="btn-export"><span class="t">Export JSON</span><span class="d">Full backup: words, sentences, lookup history</span></button>
            <button type="button" id="btn-export-anki"><span class="t">Export for Anki (TSV)</span><span class="d">Fill-in-the-blank cards from your sentences</span></button>
            <button type="button" id="btn-import"><span class="t">Import JSON</span><span class="d">Restore a backup; duplicates are skipped</span></button>
          </div>
        </details>
        <input type="file" id="file-import" accept="application/json,.json" class="hidden">
      </div>
    </div>
  </header>

  <main class="page main">
    <div class="title-row">
      <h1>Vocabulary</h1>
      <p class="muted" id="stats"></p>
      <details class="more-stats" id="stats-more">
        <summary class="link-btn">More stats</summary>
        <div class="card stats-panel" id="stats-panel"></div>
      </details>
    </div>

    <section class="suggest card hidden" id="suggest" aria-labelledby="suggest-title">
      <span class="suggest-title" id="suggest-title">Looked up often but not saved yet:</span>
      <div class="chips" id="suggest-chips"></div>
    </section>

    <div class="layout">
      <aside class="side" aria-label="Word list">
        <label class="search-field">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input type="search" id="q" aria-label="Search words or meanings" placeholder="Search words or meanings" autocomplete="off">
        </label>

        <div class="lang-chips" id="lang-chips" role="group" aria-label="Filter by language">
          <button type="button" class="pill" data-lang="" aria-pressed="true">All</button>
          <button type="button" class="pill" data-lang="en" aria-pressed="false">English</button>
          <button type="button" class="pill" data-lang="ja" aria-pressed="false">Japanese</button>
        </div>
        <select id="f-lang" hidden>
          <option value="">All</option>
          <option value="en">English</option>
          <option value="ja">Japanese</option>
        </select>

        <div class="filters">
          <select class="input" id="f-status" aria-label="Filter by learning status">
            <option value="">Any status</option>
            <option value="new">New</option>
            <option value="learning">Learning</option>
            <option value="known">Known</option>
            <option value="ignored">Ignored</option>
          </select>
        </div>

        <div class="list-head">
          <span class="muted" id="count" role="status"></span>
          <select class="input" id="f-sort" aria-label="Sort">
            <option value="newest">Newest first</option>
            <option value="oldest">Oldest first</option>
            <option value="alpha">A to Z</option>
            <option value="exposures">Met most often</option>
          </select>
        </div>

        <ul class="list card" id="list"></ul>
      </aside>

      <article class="detail card" id="detail" aria-label="Word details">
        <div class="placeholder muted">Pick a word from the list to see its details.</div>
      </article>
    </div>
  </main>
  <script type="module" src="vocabulary.js"></script>
</body>
</html>
